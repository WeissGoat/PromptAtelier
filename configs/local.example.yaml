legacy:
  tags_machine_root: "F:/my_project/new/tags_machine"
  design_root: "F:/my_project/new/tags_machine/design"

runtime:
  cache_dir: "cache"
  output_dir: "outputs"

defaults:
  backend: "novelai"
  image_format: "png"

generation:
  executor: "ai_image_gateway_raw"

web:
  project_requires:
    - examples/project/collections.yaml
    - examples/project/nai_const_action_groups.yaml

artist_input_filter:
  negative_prompt:
    enabled: true
    blocked_tokens:
      - nsfw
    fields:
      - negative_prompt
      - after_negative_prompt

novelai:
  base_url: "https://image.novelai.net"
  access_token: null
  access_token_env: "NAI_ACCESS_TOKEN"
  timeout: 120
  retry: 3
  retry_interval: 8
  request_interval: 3

comfyui:
  # 顶层是所有目标的默认值；每个目标只写不同的字段。
  timeout: 300
  poll_interval: 1.0
  max_wait_seconds: 600
  retry: 3
  retry_interval: 2.0
  # 切换目标：--comfyui-target modal，或环境变量 TAGS_MACHINE_CORE_COMFYUI_TARGET=modal。
  default_target: local
  targets:
    local:
      base_url: "http://127.0.0.1:8188"
    modal:
      # modal deploy deploy/comfyui/providers/modal_app.py 输出的地址
      base_url: "https://<workspace>--tm-comfyui-api.modal.run"
      path_style: posix            # 把 Windows 导出的 "风格\\x.safetensors" 改成 "/"
      cold_start_wait_seconds: 300 # 首次请求前等冷启动
      allow_no_wait: false         # 缩容后未轮询的结果会丢
      auth:
        type: bearer
        token_env: TM_COMFYUI_MODAL_TOKEN  # 值为 Modal proxy token：wk-xxx.ws-yyy

sd:
  base_url: "http://127.0.0.1:7860"
  timeout: 120
