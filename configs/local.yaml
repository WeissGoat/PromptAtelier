legacy:
  tags_machine_root: "F:/my_project/new/tags_machine"
  design_root: "F:/my_project/new/tags_machine/design"

runtime:
  cache_dir: "cache"
  output_dir: "outputs"

defaults:
  backend: "novelai"
  image_format: "png"

generation:
  executor: "ai_image_gateway_raw"

web:
  project_requires:
    - examples/project/collections.yaml
    - examples/project/nai_const_action_groups.yaml

novelai:
  base_url: "https://image.novelai.net"
  access_token: "pst-84DFUXraGuZzmYJ0kZ_pqx4xW8iB1Qb9aEbH8tkvTpfyXIS4r1nBmokHqWCun5qc"
  access_token_env: "NAI_ACCESS_TOKEN"
  timeout: 120
  retry: 3
  retry_interval: 8
  request_interval: 3

comfyui:
  timeout: 300
  poll_interval: 1.0
  max_wait_seconds: 600
  retry: 3
  retry_interval: 2.0
  # 切换目标：--comfyui-target modal，或环境变量 TAGS_MACHINE_CORE_COMFYUI_TARGET=modal
  default_target: local
  targets:
    local:
      label: "本机 aki"
      base_url: "http://127.0.0.1:8188"
    modal:
      label: "Modal 云端"
      base_url: "https://efreetknift--tm-comfyui-api.modal.run"
      path_style: posix
      cold_start_wait_seconds: 300
      allow_no_wait: false
      auth:
        type: bearer
        token_env: TM_COMFYUI_MODAL_TOKEN
      status_probe:
        type: modal
        app: tm-comfyui
        function: api
        idle_shutdown_seconds: 180

sd:
  base_url: "http://127.0.0.1:7860"
  timeout: 120
