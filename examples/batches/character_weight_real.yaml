schema: tags-machine-core.batch/v1
name: character-weight-real
config: configs/local.example.yaml
output_dir: acceptance_compare/character_weight_real/images

defaults:
  backend: novelai
  composer: script
  artist: 20260412
  model: nai-diffusion-4-5-full
  nt: 1
  resolution: portrait
  character_prompts: auto
  prompt_policy:
    require: ../prompt_policies/character_weight.yaml

select:
  characters:
    - selector: explicit
      refs:
        - F:/my_project/new/tags_machine/design/角色/danbooru_mahou_shoujo_madoka_magica/danbooru_akemi_homura_暁美ほむら _魔法少女

  actions:
    - selector: explicit
      refs:
        - F:/my_project/new/tags_machine/design/动作改2/pn_human_solo_body_display_standing/00_start_20260523_比基尼站姿露肩

expand:
  mode: product

run:
  execution_mode: real
  fresh: true
  max_images: 1
  retry:
    max_attempts: 3
    retry_on:
      - "429"
      - "500"
      - "502"
      - "503"
      - "504"
      - timeout

archive:
  save_prompt_bundle: true
  save_render_request: true
  save_generation_result: true
  save_png_params: true
