schema: tags-machine-core.batch/v1
name: st-rp-bound-room-homura-hypnosis
description: Homura 催眠主题定制图集

config: ../../configs/local.yaml
work_root: G:/ai_auto/{date}/runs
output_dir: G:/ai_auto/{date}

album_plan:
  action_root: F:/my_project/new/tags_machine/design/动作改2
  path: st_rp_bound_room_homura_hypnosis/AlbumPlan.yaml

defaults:
  backend: novelai
  composer: agent
  artist: 109841329_03_manga_monochrome_yabuki_rance_no_vibe_latest_stable
  nt: 3
  resolution: square
  model: nai-diffusion-4-5-full
  character_prompts: auto
  add_male_caption: true

expand:
  mode: album_plan

run:
  resume: true
  retry:
    max_attempts: 3
    retry_on: ["429", "502", "503", "504", timeout]

archive:
  save_parameter_image: true
