schema: tags-machine.artist/v1
kind: artist
id: comfyui_cunyfunky
description: "ComfyUI Aki cunyfunky API workflow preset."

tags:
  artist:
    - "cunyfunky"

renderers:
  comfyui:
    workflow: cunyfunky
    workflow_path: workflows/cunyfunky_api.json
    workflow_ui_path: workflows/cunyfunky.json
    prompt_format: comfyui

    inputs:
      # 直接写入正向 CLIPTextEncode；NovelAI 加权由 core 的 ComfyUI 渲染层转换，
      # 原来的 #218 通配符和 #219 转换节点不再参与（会把 {tag} 的加权吃掉）。
      positive_prompt: "165.inputs.text"
      negative_prompt: "153.inputs.text"
      width: "23.inputs.width"
      height: "23.inputs.height"
      seed: "202.inputs.seed"

    optional_inputs:
      steps:
        - "3.inputs.steps"
        - "17.inputs.steps"
      cfg:
        - "3.inputs.cfg"
        - "17.inputs.cfg"
      sampler:
        - "3.inputs.sampler_name"
        - "17.inputs.sampler_name"
      scheduler:
        - "3.inputs.scheduler"
        - "17.inputs.scheduler"

    output_nodes:
      - "212"

    node_overrides: {}
