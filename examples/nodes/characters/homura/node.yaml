schema: tags-machine-core.node/v1
kind: character
id: homura
name: Akemi Homura
description: 结构化角色节点示例，展示局部镜头下如何过滤脸部、发型和服装细节。

tags:
  identity:
    - akemi homura
  source:
    - puella magi madoka magica

prompt:
  positive:
    - text: akemi homura
      role: identity
      include_scopes: ["*"]
    - text: purple eyes
      role: eyes
      include_scopes: [face_detail, upper_body, full_body]
      exclude_scopes: [foot_detail]
    - text: long black hair
      role: hair
      include_scopes: [face_detail, upper_body, full_body]
      exclude_scopes: [foot_detail]
    - text: school uniform
      role: clothing
      include_scopes: [upper_body, full_body]
      exclude_scopes: [foot_detail]
    - text: bare soles
      role: feet
      include_scopes: [foot_detail, lower_body, full_body]
  negative:
    - text: extra toes
      role: anatomy

constraints:
  required_parts:
    - akemi homura
  forbidden_parts:
    - purple eyes
    - long black hair
    - school uniform
  notes:
    - foot_detail 镜头下只保留身份和脚部相关描述。

agent:
  summary: Homura 角色示例。脚底特写时过滤眼睛、头发和上半身服装。
  labels:
    - character
    - foot-aware
