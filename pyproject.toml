[project]
name = "tags-machine-core"
version = "0.1.0"
description = "Clean prompt composition and render planning core for Tags Machine."
requires-python = ">=3.11"
dependencies = [
    "ai-image-gateway",
    "fastapi>=0.115",
    "Pillow>=10.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
tm-core = "tags_machine_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
ai-image-gateway = { path = "vendor/ai-image-gateway", editable = true }

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
