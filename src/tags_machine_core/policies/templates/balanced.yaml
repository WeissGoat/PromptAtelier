schema: tags-machine-core.prompt-policy-template/v1
name: balanced
require: "off"
enabled: true
rules:
  tag_normalize:
    enabled: true
  dedupe:
    enabled: true
  character_section_filter:
    enabled: true
    options:
      blocked_sections:
        - copyright
  tag_inference:
    enabled: true
    options:
      rules:
        - id: barefoot_to_bare_legs
          when_any:
            - barefoot
            - bare_feet
            - bare_foot
            - barefeet
          add:
            - bare_legs
          position: after_trigger
  tag_conflict:
    enabled: true
  character_count:
    enabled: true
  clothing_policy:
    enabled: true
  visibility_policy:
    enabled: true
