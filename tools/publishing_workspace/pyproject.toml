[project]
name = "publishing-workspace"
version = "0.1.0"
description = "Image catalog, classification, and publishing workspace tools."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
mosaic = [
    "numpy",
    "opencv-python",
    "requests",
    "scipy",
    "segment-anything",
    "torch",
    "ultralytics",
]

[project.scripts]
publishing-workspace = "publishing_workspace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
]
